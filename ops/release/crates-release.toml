schema_version = 1
versioning_model = "workspace-unified"

[publish]
allow = [
  "bijux-atlas-core",
  "bijux-atlas-model",
  "bijux-atlas-api",
  "bijux-atlas-ops",
  "bijux-atlas-query",
  "bijux-atlas-ingest",
  "bijux-atlas-store",
  "bijux-atlas-runtime",
  "bijux-atlas",
  "bijux-atlas-cli",
  "bijux-atlas-server",
]
deny = [
  "bijux-atlas-dev",
]

[roles]
"bijux-atlas-dev" = "developer-tool-private"
"bijux-atlas" = "atlas-platform"
"bijux-atlas-api" = "api-contract"
"bijux-atlas-cli" = "binary-entrypoint"
"bijux-atlas-core" = "runtime-foundation"
"bijux-atlas-ingest" = "ingest-engine"
"bijux-atlas-model" = "data-model"
"bijux-atlas-ops" = "operations-contract"
"bijux-atlas-query" = "query-engine"
"bijux-atlas-runtime" = "runtime-orchestrator"
"bijux-atlas-server" = "http-entrypoint"
"bijux-atlas-store" = "artifact-store"

[metadata_requirements]
required_package_fields = [
  "description",
  "license",
  "repository",
  "homepage",
  "documentation",
  "readme",
  "categories",
  "keywords",
]
