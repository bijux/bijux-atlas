[workspace]
members = [
  "crates/bijux-atlas-ops",
  "crates/bijux-atlas-dev",
  "crates/bijux-atlas",
  "crates/bijux-atlas-runtime",
  "crates/bijux-atlas-api",
  "crates/bijux-atlas-cli",
  "crates/bijux-atlas-core",
  "crates/bijux-atlas-ingest",
  "crates/bijux-atlas-model",
  "crates/bijux-atlas-query",
  "crates/bijux-atlas-server",
  "crates/bijux-atlas-store",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.2.2"
license = "Apache-2.0"
rust-version = "1.86.0"
description = "Genomics dataset delivery platform for immutable artifacts, gene-query APIs, and Rust-owned repository automation"
repository = "https://github.com/bijux/bijux-atlas.git"
homepage = "https://bijux.io/bijux-atlas/"
keywords = ["bioinformatics", "genomics", "gff3", "fasta", "gene-query"]

[workspace.lints.rust]
unsafe_code = "forbid"
unused_crate_dependencies = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Redis releases newer than 1.2.2 currently exceed the workspace Rust 1.86.0 contract.
redis = { version = "=1.2.2", features = ["tokio-comp"] }
# rusqlite 0.40 pulls libsqlite3-sys that does not currently build under Rust 1.86.0 here.
rusqlite = { version = "0.40", features = ["bundled", "vtab", "hooks"] }
bijux-atlas = { version = "=0.2.2", path = "crates/bijux-atlas" }
bijux-atlas-runtime = { version = "=0.2.2", path = "crates/bijux-atlas-runtime" }
bijux-atlas-api = { version = "=0.2.2", path = "crates/bijux-atlas-api" }
bijux-atlas-cli = { version = "=0.2.2", path = "crates/bijux-atlas-cli" }
bijux-atlas-core = { version = "=0.2.2", path = "crates/bijux-atlas-core" }
bijux-atlas-ingest = { version = "=0.2.2", path = "crates/bijux-atlas-ingest" }
bijux-atlas-model = { version = "=0.2.2", path = "crates/bijux-atlas-model" }
bijux-atlas-query = { version = "=0.2.2", path = "crates/bijux-atlas-query" }
bijux-atlas-server = { version = "=0.2.2", path = "crates/bijux-atlas-server" }
bijux-atlas-store = { version = "=0.2.2", path = "crates/bijux-atlas-store", default-features = false }
bijux-atlas-dev = { version = "=0.2.2", path = "crates/bijux-atlas-dev" }
bijux-atlas-ops = { version = "=0.2.2", path = "crates/bijux-atlas-ops" }
bijux-cli = "0.3.6"
semver = "1"
