[package]
name = "bijux-atlas-api"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
rust-version.workspace = true
description = "Stable Atlas API contracts, OpenAPI metadata, and request or response normalization"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/bijux-atlas-api/latest/bijux_atlas_api/"
readme = "README.md"
categories = ["api-bindings", "science::bioinformatics"]
exclude = ["tests/fixtures/**"]
keywords = ["bioinformatics", "genomics", "api", "openapi", "contracts"]

[dependencies]
bijux-atlas-core = { workspace = true, features = ["serde"] }
bijux-atlas-model = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2", "charset", "json"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
axum = "0.8"
bijux-atlas = { workspace = true }
criterion = "0.8"
hex = "0.4"
hmac = "0.13"
regex = "1.11"
rusqlite = { version = "0.39", features = ["bundled", "vtab", "hooks"] }
sha2 = "0.11"
tempfile = "=3.27.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }

[[test]]
name = "contracts"
path = "tests/contracts.rs"

[[test]]
name = "client"
path = "tests/client.rs"

[[test]]
name = "http_contracts"
path = "tests/http_contracts.rs"

[[test]]
name = "http_surface"
path = "tests/http_surface.rs"

[[test]]
name = "http_observability"
path = "tests/http_observability.rs"

[[bench]]
name = "openapi_generation"
path = "benches/openapi_generation.rs"
harness = false
