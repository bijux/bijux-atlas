[package]
name = "bijux-atlas-server"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
rust-version.workspace = true
description = "Runtime server entrypoint for Atlas HTTP delivery and cache orchestration"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/bijux-atlas-server/latest/bijux_atlas_server/"
readme = "README.md"
categories = ["web-programming::http-server", "science::bioinformatics"]
keywords = ["bioinformatics", "genomics", "atlas", "server", "http"]

[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
base64 = "0.22"
axum = "0.8"
bijux-atlas-api.workspace = true
bijux-atlas-core.workspace = true
bijux-atlas-model.workspace = true
bijux-atlas-query.workspace = true
bijux-atlas-runtime.workspace = true
brotli = "8"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hmac = "0.13"
hex = "0.4"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["http-proto", "reqwest-client"] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
redis = { version = "1.2", features = ["tokio-comp"] }
rusqlite = { version = "0.39", features = ["bundled", "vtab", "hooks"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dependencies.tikv-jemallocator]
version = "0.6"
optional = true

[dev-dependencies]
async-trait = "0.1"
axum = "0.8"
bijux-atlas-model.workspace = true
criterion = "0.8"
redis = { version = "1.2", features = ["tokio-comp"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2", "charset", "json"] }
rusqlite = { version = "0.39", features = ["bundled", "vtab", "hooks"] }
serde_json.workspace = true
tempfile = "=3.27.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }

[[bin]]
name = "bijux-atlas-server"
path = "src/bin/bijux-atlas-server.rs"

[[test]]
name = "interfaces_server"
path = "tests/interfaces_server.rs"

[[bench]]
name = "cache_manager"
path = "benches/cache_manager.rs"
harness = false

[[bench]]
name = "sequence_fetch"
path = "benches/sequence_fetch.rs"
harness = false

[[bench]]
name = "diff_merge"
path = "benches/diff_merge.rs"
harness = false

[[bench]]
name = "bulkhead_tuning"
path = "benches/bulkhead_tuning.rs"
harness = false

[[bench]]
name = "gene_lookup_p99"
path = "benches/gene_lookup_p99.rs"
harness = false
