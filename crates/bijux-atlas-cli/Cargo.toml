[package]
name = "bijux-atlas-cli"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
rust-version.workspace = true
description = "User CLI entrypoint for Atlas dataset, query, validation, and export workflows"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/bijux-atlas-cli/latest/bijux_atlas_cli/"
readme = "README.md"
categories = ["command-line-utilities", "science::bioinformatics"]
exclude = ["tests/fixtures/**"]
keywords = ["bioinformatics", "genomics", "atlas", "cli", "query"]

[dependencies]
bijux-atlas-core.workspace = true
bijux-atlas-ingest.workspace = true
bijux-atlas-model.workspace = true
bijux-atlas-query.workspace = true
bijux-atlas-runtime.workspace = true
bijux-atlas-store.workspace = true
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
csv = "1.4"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2", "charset", "json"] }
rusqlite = { version = "0.39", features = ["bundled", "vtab", "hooks"] }
serde.workspace = true
serde_json.workspace = true
tar = "0.4"
zstd = "0.13"

[dev-dependencies]
assert_cmd = "2"
bijux-cli.workspace = true
tempfile = "=3.27.0"

[[bin]]
name = "bijux-atlas"
path = "src/bin/bijux-atlas.rs"
