[package]
name = "bijux-atlas-cli"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
rust-version.workspace = true
description = "User CLI entrypoint for Atlas dataset, query, validation, and export workflows"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/bijux-atlas-cli/latest/bijux_atlas_cli/"
readme = "README.md"
categories = ["command-line-utilities", "science::bioinformatics"]
keywords = ["bioinformatics", "genomics", "atlas", "cli", "query"]

[dependencies]
bijux-atlas.workspace = true

[dev-dependencies]
assert_cmd = "2"
bijux-cli.workspace = true
bijux-atlas-model.workspace = true
rusqlite = { version = "0.39", features = ["bundled", "vtab", "hooks"] }
serde_json.workspace = true
tempfile = "=3.27.0"

[[bin]]
name = "bijux-atlas"
path = "src/bin/bijux-atlas.rs"
