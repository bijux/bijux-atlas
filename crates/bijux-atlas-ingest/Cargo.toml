[package]
name = "bijux-atlas-ingest"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
rust-version.workspace = true
description = "Atlas ingest engine contracts, normalization, and artifact build surfaces"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/bijux-atlas-ingest/latest/bijux_atlas_ingest/"
readme = "README.md"
categories = ["science::bioinformatics"]
exclude = ["tests/fixtures/**"]
keywords = ["bioinformatics", "genomics", "ingest", "gff3", "fasta"]

[dependencies]
bijux-atlas-core = { workspace = true, features = ["serde"] }
bijux-atlas-model = { workspace = true }
bijux-atlas-query = { workspace = true }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-normalization = "0.1"
zstd = "0.13"

[dev-dependencies]
criterion = "0.8"
hex = "0.4"
proptest = "1"
tempfile = "=3.27.0"
toml = "1.0"

[lib]
path = "src/lib.rs"

[[test]]
name = "ingest_workflows"
path = "tests/ingest_workflows.rs"

[[bench]]
name = "ingest_db_size_growth"
path = "benches/ingest/db_size_growth.rs"
harness = false

