[package]
name = "bijux-atlas-model"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
rust-version.workspace = true
description = "Persisted Atlas model types, serde contracts, and stable boundary values"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/bijux-atlas-model/latest/bijux_atlas_model/"
readme = "README.md"
categories = ["data-structures", "science::bioinformatics"]
exclude = ["tests/fixtures/**"]
keywords = ["bioinformatics", "genomics", "model", "contracts", "serde"]

[dependencies]
bijux-atlas-core = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
criterion = "0.8"
proptest = "1"

[[test]]
name = "model_contracts"
path = "tests/model_contracts.rs"

[[bench]]
name = "manifest_codec"
path = "benches/manifest_codec.rs"
harness = false

[[bench]]
name = "parse_validation"
path = "benches/parse_validation.rs"
harness = false

[lib]
path = "src/lib.rs"
