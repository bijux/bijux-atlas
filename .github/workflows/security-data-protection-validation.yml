name: security-data-protection-validation

on:
  pull_request:

jobs:
  validate-data-protection:
    name: "${{ (github.event.pull_request.user.login == 'dependabot[bot]' || (github.event.pull_request.user.login == 'github-actions[bot]' && github.event.pull_request.head.ref == 'automation/dependency-lock-refresh')) && 'unverified dependency / ' || '' }}validate-data-protection"
    if: "${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'pull_request_review') || (github.event.pull_request.user.login != 'dependabot[bot]' && (github.event.pull_request.user.login != 'github-actions[bot]' || github.event.pull_request.head.ref != 'automation/dependency-lock-refresh'))) && (github.event.pull_request.user.login != 'dependabot[bot]') }}"
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: setup-rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.86.0

      - name: run data protection contracts
        run: cargo test --locked -p bijux-atlas-runtime --test contracts_runtime_foundations security_data_protection_contracts -- --nocapture

      - name: run governance contract
        run: cargo run --locked -q -p bijux-atlas-dev -- governance validate --format json

      - name: generate governance evidence required by security policy
        run: |
          cargo run --locked -q -p bijux-atlas-dev -- governance exceptions validate --repo-root "${GITHUB_WORKSPACE}" --format json || true
          cargo run --locked -q -p bijux-atlas-dev -- governance deprecations validate --repo-root "${GITHUB_WORKSPACE}" --format json || true
          cargo run --locked -q -p bijux-atlas-dev -- governance breaking validate --repo-root "${GITHUB_WORKSPACE}" --format json || true
          cargo run --locked -q -p bijux-atlas-dev -- governance doctor --repo-root "${GITHUB_WORKSPACE}" --format json || true
      - name: verify governance evidence files exist
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "artifacts/governance/exceptions-summary.json"
            "artifacts/governance/exceptions-expiry-warning.json"
            "artifacts/governance/exceptions-churn.json"
            "artifacts/governance/deprecations-summary.json"
            "artifacts/governance/compat-warnings.json"
            "artifacts/governance/breaking-changes.json"
            "artifacts/governance/governance-doctor.json"
            "artifacts/governance/institutional-delta.md"
            "artifacts/governance/institutional-delta-inputs.json"
          )
          for file in "${required[@]}"; do
            test -f "${file}" || { echo "missing governance evidence file: ${file}" >&2; exit 1; }
          done

      - name: validate security controls
        run: cargo run --locked -q -p bijux-atlas-dev -- security validate --format json
