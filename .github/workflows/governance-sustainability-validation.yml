name: Governance Sustainability Validation

on:
  pull_request:
    paths:
      - "docs/06-development/**"
      - "configs/sources/governance/governance/**"
      - "ops/governance/**"
      - "crates/bijux-atlas-dev/src/commands/governance.rs"
      - "crates/bijux-atlas-dev/tests/*governance*"
  workflow_dispatch: {}

jobs:
  governance-sustainability:
    name: "${{ (github.event.pull_request.user.login == 'dependabot[bot]' || (github.event.pull_request.user.login == 'github-actions[bot]' && github.event.pull_request.head.ref == 'automation/dependency-lock-refresh')) && 'unverified dependency / ' || '' }}governance-sustainability"
    if: "${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'pull_request_review') || (github.event.pull_request.user.login != 'dependabot[bot]' && (github.event.pull_request.user.login != 'github-actions[bot]' || github.event.pull_request.head.ref != 'automation/dependency-lock-refresh'))) && (github.event.pull_request.user.login != 'dependabot[bot]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Governance checks
        run: |
          cargo run --locked -q -p bijux-atlas-dev -- governance check --format json
          cargo run --locked -q -p bijux-atlas-dev -- governance validate --format json
          cargo run --locked -q -p bijux-atlas-dev -- governance report --format json
      - name: Governance sustainability contracts
        run: cargo test --locked -p bijux-atlas-dev --test governance_policy_guards -- --nocapture
