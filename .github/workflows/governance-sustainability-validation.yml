name: Governance Sustainability Validation

on:
  pull_request:
    paths:
      - "docs/06-development/**"
      - "configs/sources/governance/governance/**"
      - "ops/governance/**"
      - "crates/bijux-atlas-dev/src/commands/governance.rs"
      - "crates/bijux-atlas-dev/tests/*governance*"
  workflow_dispatch: {}

jobs:
  governance-sustainability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - name: Governance checks
        run: |
          cargo run --locked -q -p bijux-atlas-dev -- governance check --format json
          cargo run --locked -q -p bijux-atlas-dev -- governance validate --format json
          cargo run --locked -q -p bijux-atlas-dev -- governance report --format json
      - name: Governance sustainability contracts
        run: cargo test --locked -p bijux-atlas-dev --test governance_policy_guards -- --nocapture
