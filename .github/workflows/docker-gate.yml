name: docker-gate

on:
  pull_request:
    paths:
      - "ops/docker/**"
      - "makes/docker.mk"
      - "makes/root.mk"
      - "crates/bijux-atlas-dev/src/commands/control_plane.rs"
      - "crates/bijux-atlas-dev/tests/dockerfile_contracts.rs"

jobs:
  docker-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo/home/docker-gate
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/cargo/target/docker-gate
      RUSTUP_HOME: ${{ github.workspace }}/.cache/rustup/docker-gate
      RUN_ID: docker-gate-${{ github.run_id }}-${{ github.run_attempt }}
      ISO_ROOT: artifacts/isolates/docker-gate
      TMPDIR: artifacts/isolates/docker-gate/tmp
      TMP: artifacts/isolates/docker-gate/tmp
      TEMP: artifacts/isolates/docker-gate/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.86.0
      - name: Restore cargo registry cache
        id: cache-registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/cargo/home/docker-gate/registry
            .cache/cargo/home/docker-gate/git
          key: cargo-registry-docker-gate-${{ runner.os }}-1.86.0-${{ hashFiles('Cargo.lock') }}
      - name: Restore cargo target cache
        id: cache-target
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/cargo/target/docker-gate
          key: cargo-target-docker-gate-${{ runner.os }}-1.86.0-${{ hashFiles('Cargo.lock') }}
      - name: Normalize temp roots to absolute workspace paths
        shell: bash
        run: |
          set -euo pipefail
          echo "TMPDIR=${GITHUB_WORKSPACE}/${TMPDIR}" >> "${GITHUB_ENV}"
          echo "TMP=${GITHUB_WORKSPACE}/${TMP}" >> "${GITHUB_ENV}"
          echo "TEMP=${GITHUB_WORKSPACE}/${TEMP}" >> "${GITHUB_ENV}"
      - name: Run docker gate checks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "artifacts/${RUN_ID}"
          mkdir -p "artifacts/${RUN_ID}"
          mkdir -p "${ISO_ROOT}" "${TMPDIR}"
          cargo run --locked -q -p bijux-atlas-dev -- docker check --allow-subprocess --format json > "artifacts/${RUN_ID}/docker-check.json" 2> "artifacts/${RUN_ID}/docker-check.stderr.log"
          make docker > "artifacts/${RUN_ID}/docker.stdout.log" 2> "artifacts/${RUN_ID}/docker.stderr.log"
      - name: Save cargo registry cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/cargo/home/docker-gate/registry
            .cache/cargo/home/docker-gate/git
          key: cargo-registry-docker-gate-${{ runner.os }}-1.86.0-${{ hashFiles('Cargo.lock') }}
      - name: Save cargo target cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/cargo/target/docker-gate
          key: cargo-target-docker-gate-${{ runner.os }}-1.86.0-${{ hashFiles('Cargo.lock') }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: docker-gate-${{ env.RUN_ID }}
          path: artifacts/${{ env.RUN_ID }}
          retention-days: 5
