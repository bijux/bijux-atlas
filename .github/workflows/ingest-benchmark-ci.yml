name: ingest-benchmark-ci

on:
  pull_request:
    paths:
      - "crates/bijux-atlas-ingest/src/**"
      - "crates/bijux-atlas-ingest/tests/**"
      - "crates/bijux-atlas-ingest/benches/**"
      - "crates/bijux-atlas-ingest/Cargo.toml"
      - "crates/bijux-atlas-runtime/Cargo.toml"
      - ".github/workflows/ingest-benchmark-ci.yml"
  workflow_dispatch:

jobs:
  ingest-benchmark:
    name: "${{ (github.event.pull_request.user.login == 'dependabot[bot]' || (github.event.pull_request.user.login == 'github-actions[bot]' && github.event.pull_request.head.ref == 'automation/dependency-lock-refresh')) && 'unverified dependency / ' || '' }}ingest-benchmark"
    if: "${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'pull_request_review') || (github.event.pull_request.user.login != 'dependabot[bot]' && (github.event.pull_request.user.login != 'github-actions[bot]' || github.event.pull_request.head.ref != 'automation/dependency-lock-refresh'))) && (github.event.pull_request.user.login != 'dependabot[bot]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.86.0
      - name: Build ingest benchmark executables
        run: cargo bench -p bijux-atlas-ingest --bench ingest_throughput --no-run --locked
      - name: Run ingest benchmark regression fixture tests
        run: cargo test -p bijux-atlas-ingest --test ingest_workflows ingest_benchmark_regression --locked -- --nocapture
