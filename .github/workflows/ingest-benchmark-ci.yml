name: ingest-benchmark-ci

on:
  pull_request:
    paths:
      - "crates/bijux-atlas-ingest/src/**"
      - "crates/bijux-atlas-ingest/tests/**"
      - "crates/bijux-atlas-ingest/benches/**"
      - "crates/bijux-atlas-ingest/Cargo.toml"
      - "crates/bijux-atlas-runtime/Cargo.toml"
      - ".github/workflows/ingest-benchmark-ci.yml"
  workflow_dispatch:

jobs:
  ingest-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.86.0
      - name: Build ingest benchmark executables
        run: cargo bench -p bijux-atlas-ingest --bench ingest_throughput --no-run --locked
      - name: Run ingest benchmark regression fixture tests
        run: cargo test -p bijux-atlas-ingest --test ingest_workflows ingest_benchmark_regression --locked -- --nocapture
