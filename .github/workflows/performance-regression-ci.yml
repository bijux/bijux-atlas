name: Performance Regression CI

on:
  pull_request:
    paths:
      - "configs/sources/operations/perf/**"
      - "ops/load/**"
      - "ops/report/generated/**"
      - "docs/bijux-atlas-ops/load/**"
      - "crates/bijux-atlas-ops/tests/performance_report_assets.rs"
      - ".github/workflows/performance-regression-ci.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  performance-regression-gate:
    name: "${{ (github.event.pull_request.user.login == 'dependabot[bot]' || (github.event.pull_request.user.login == 'github-actions[bot]' && github.event.pull_request.head.ref == 'automation/dependency-lock-refresh')) && 'unverified dependency / ' || '' }}performance-regression-gate"
    if: "${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'pull_request_review') || (github.event.pull_request.user.login != 'dependabot[bot]' && (github.event.pull_request.user.login != 'github-actions[bot]' || github.event.pull_request.head.ref != 'automation/dependency-lock-refresh'))) && (github.event.pull_request.user.login != 'dependabot[bot]') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate policy and generated assets
        run: |
          jq . configs/sources/operations/perf/regression-policy.json > /dev/null
          jq . configs/sources/operations/perf/regression-notifications.json > /dev/null
          jq . ops/report/generated/performance-regression-report.json > /dev/null
          jq . ops/report/generated/performance-history.json > /dev/null
          jq . ops/report/generated/performance-trend.json > /dev/null
          jq . ops/report/generated/performance-anomalies.json > /dev/null
          jq . ops/report/generated/performance-dashboard.json > /dev/null
          jq . ops/report/generated/performance-ci-artifacts.json > /dev/null
          jq . ops/report/generated/performance-ci-summary.json > /dev/null
          jq . ops/report/generated/performance-badges.json > /dev/null
          jq . ops/report/generated/performance-trend-graph.json > /dev/null
          jq . ops/report/generated/performance-metadata.json > /dev/null
          jq . ops/report/generated/performance-baseline-verification.json > /dev/null
          jq . ops/report/generated/performance-audit-report.json > /dev/null
          jq . ops/report/generated/performance-completion-report.json > /dev/null
          jq . configs/schemas/contracts/perf/performance-metadata.schema.json > /dev/null

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.86.0

      - name: Run regression detector and validation via control-plane
        run: |
          cargo run --locked -p bijux-atlas-dev -- perf diff ops/load/baselines/system-load-baseline.json ops/load/baselines/system-load-baseline.json --format json > /tmp/perf-regressions.json
          cargo run --locked -p bijux-atlas-dev -- perf validate --format json > /tmp/performance-regression-report.json
          jq . /tmp/perf-regressions.json > /dev/null
          jq . /tmp/performance-regression-report.json > /dev/null

      - name: Run performance regression asset tests
        run: cargo test -p bijux-atlas-ops --test performance_report_assets --locked -- --nocapture

      - name: Publish step summary
        run: |
          {
            echo "## Performance Regression CI"
            echo ""
            echo "- Policy: configs/sources/operations/perf/regression-policy.json"
            echo "- Notifications: configs/sources/operations/perf/regression-notifications.json"
            echo "- Report: ops/report/generated/performance-regression-report.json"
            echo "- History: ops/report/generated/performance-history.json"
            echo "- Trend: ops/report/generated/performance-trend.json"
          } >> "${GITHUB_STEP_SUMMARY}"
