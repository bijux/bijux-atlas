"name": "release-artifacts"
"on":
  "workflow_call":
    "inputs":
      "package_slug":
        "required": true
        "type": "string"
      "release_tag":
        "required": true
        "type": "string"
      "package_dir":
        "required": true
        "type": "string"
      "artifacts_dir":
        "required": true
        "type": "string"
      "makefile_path":
        "required": false
        "type": "string"
        "default": ""
      "build_targets":
        "required": false
        "type": "string"
        "default": "build"
      "dist_subdir":
        "required": false
        "type": "string"
        "default": "build"
"permissions":
  "contents": "read"
"concurrency":
  "group": "release-artifacts-${{ github.workflow }}-${{ github.ref }}-${{ inputs.package_slug }}"
  "cancel-in-progress": false
"jobs":
  "build":
    "name": "release-artifacts-${{ inputs.package_slug }}"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 10
    "env":
      "ARTIFACTS_DIR": "${{ inputs.artifacts_dir }}"
    "steps":
      - "name": "Checkout repository"
        "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        "with":
          "fetch-depth": 0
          "fetch-tags": true
          "ref": "${{ github.sha }}"
      - "name": "Setup Python"
        "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97"
        "with":
          "python-version": "3.11"
      - "name": "Setup uv"
        "uses": "astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7"
        "with":
          "enable-cache": true
          "cache-dependency-glob": "uv.lock"
      - "name": "Install package toolchain"
        "shell": "bash"
        "run": "set -euo pipefail\nmakefile=\"${{ inputs.makefile_path }}\"\nif [ -z \"$makefile\" ]; then\n  makefile=\"makes/packages/$(basename '${{ inputs.package_dir }}').mk\"\nfi\nmakefile=\"${GITHUB_WORKSPACE}/$makefile\"\nmake -f \"$makefile\" -C \"${{ inputs.package_dir }}\" install\n"
      - "name": "Build release artifacts"
        "shell": "bash"
        "run": "set -euo pipefail\nmakefile=\"${{ inputs.makefile_path }}\"\nif [ -z \"$makefile\" ]; then\n  makefile=\"makes/packages/$(basename '${{ inputs.package_dir }}').mk\"\nfi\nmakefile=\"${GITHUB_WORKSPACE}/$makefile\"\nfor target in ${{ inputs.build_targets }}; do\n  make -f \"$makefile\" -C \"${{ inputs.package_dir }}\" \"$target\"\ndone\n"
      - "name": "Stage publish artifacts"
        "shell": "bash"
        "run": "set -euo pipefail\nstage_dir=\".github/tmp/${{ inputs.package_slug }}-dist\"\ndist_dir=\"${ARTIFACTS_DIR}/${{ inputs.dist_subdir }}\"\nmkdir -p \"$stage_dir\"\nmapfile -d '' dist_files < <(\n  find \"$dist_dir\" -type f \\( -name '*.whl' -o -name '*.tar.gz' \\) -print0 | sort -z\n)\nif [ \"${#dist_files[@]}\" -eq 0 ]; then\n  echo \"No publish artifacts found under $dist_dir\" >&2\n  find \"${ARTIFACTS_DIR}\" -maxdepth 4 -type f | sort || true\n  exit 1\nfi\ncp \"${dist_files[@]}\" \"$stage_dir\"/\n"
      - "name": "Stage GitHub release assets"
        "shell": "bash"
        "run": "set -euo pipefail\nstage_dir=\".github/tmp/${{ inputs.package_slug }}-release\"\ndist_dir=\"${ARTIFACTS_DIR}/${{ inputs.dist_subdir }}\"\nrm -rf \"$stage_dir\"\nmkdir -p \"$stage_dir\"\nwhile IFS= read -r -d '' file_path; do\n  asset_name=\"${{ inputs.package_slug }}-dist-$(basename \"$file_path\")\"\n  cp \"$file_path\" \"$stage_dir/$asset_name\"\ndone < <(find \"$dist_dir\" -type f -print0 | sort -z)\nsbom_dir=\"${ARTIFACTS_DIR}/sbom\"\nif [ -d \"$sbom_dir\" ]; then\n  while IFS= read -r -d '' file_path; do\n    case \"$(basename \"$file_path\")\" in\n      *.prod.cdx.json)\n        asset_name=\"${{ inputs.package_slug }}-sbom-prod.cdx.json\"\n        ;;\n      *.dev.cdx.json)\n        asset_name=\"${{ inputs.package_slug }}-sbom-dev.cdx.json\"\n        ;;\n      summary.txt)\n        asset_name=\"${{ inputs.package_slug }}-sbom-summary.txt\"\n        ;;\n      *)\n        continue\n        ;;\n    esac\n    cp \"$file_path\" \"$stage_dir/$asset_name\"\n  done < <(find \"$sbom_dir\" -type f -print0 | sort -z)\nfi\n"
      - "name": "Verify release revision and repository artifact policy"
        "shell": "bash"
        "env":
          "DIST_DIR": ".github/tmp/${{ inputs.package_slug }}-dist"
          "RELEASE_ASSET_DIR": ".github/tmp/${{ inputs.package_slug }}-release"
          "PACKAGE_DIR": "${{ inputs.package_dir }}"
          "PACKAGE_SLUG": "${{ inputs.package_slug }}"
          "RELEASE_TAG": "${{ inputs.release_tag }}"
        "run": "set -euo pipefail\n\ncase \"${RELEASE_TAG}\" in\n  v?*) ;;\n  *)\n    echo \"release_tag must start with 'v' and include a version: ${RELEASE_TAG}\" >&2\n    exit 1\n    ;;\nesac\n\ntag_commit=\"$(git rev-parse --verify \"refs/tags/${RELEASE_TAG}^{commit}\")\"\nhead_commit=\"$(git rev-parse --verify HEAD)\"\nif [[ \"${tag_commit}\" != \"${head_commit}\" || \"${head_commit}\" != \"${GITHUB_SHA}\" ]]; then\n  echo \"Release tag, checkout, and workflow revision must identify one commit.\" >&2\n  echo \"tag ${RELEASE_TAG}: ${tag_commit}\" >&2\n  echo \"HEAD: ${head_commit}\" >&2\n  echo \"GITHUB_SHA: ${GITHUB_SHA}\" >&2\n  exit 1\nfi\n\ntest -d \"${DIST_DIR}\"\ntest -d \"${RELEASE_ASSET_DIR}\"\nfound_distribution=0\nfor distribution in \"${DIST_DIR}\"/*.whl \"${DIST_DIR}\"/*.tar.gz; do\n  [[ -f \"${distribution}\" ]] || continue\n  cmp -- \"${distribution}\" \"${RELEASE_ASSET_DIR}/${PACKAGE_SLUG}-dist-$(basename \"${distribution}\")\"\n  found_distribution=1\ndone\ntest \"${found_distribution}\" = 1\nfor release_asset in \"${RELEASE_ASSET_DIR}\"/*.whl \"${RELEASE_ASSET_DIR}\"/*.tar.gz; do\n  [[ -f \"${release_asset}\" ]] || continue\n  asset_name=\"$(basename \"${release_asset}\")\"\n  case \"${asset_name}\" in\n    \"${PACKAGE_SLUG}-dist-\"*) ;;\n    *) echo \"Unexpected release distribution: ${asset_name}\" >&2; exit 1 ;;\n  esac\n  cmp -- \"${DIST_DIR}/${asset_name#\"${PACKAGE_SLUG}-dist-\"}\" \"${release_asset}\"\ndone\n\nif [[ -f .github/release.env ]]; then\n  set -a\n  source .github/release.env\n  set +a\nfi\nverification_command=\"${BIJUX_RELEASE_ARTIFACT_VERIFICATION_COMMAND:-}\"\nif [[ -n \"${verification_command}\" ]]; then\n  eval \"${verification_command}\"\nfi\n"
      - "name": "Upload publish artifacts"
        "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
        "with":
          "name": "${{ inputs.package_slug }}-pypi-dist"
          "path": ".github/tmp/${{ inputs.package_slug }}-dist/*"
          "if-no-files-found": "error"
          "retention-days": 14
      - "name": "Upload release artifacts"
        "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
        "with":
          "name": "${{ inputs.package_slug }}-release"
          "path": ".github/tmp/${{ inputs.package_slug }}-release/**/*"
          "if-no-files-found": "error"
          "retention-days": 14
