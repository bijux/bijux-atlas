name: final-readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/bijux-atlas-dev/src/application/audit.rs"
      - "crates/bijux-atlas-dev/src/application/docs/**"
      - "configs/sources/governance/audit/**"
      - "docs/bijux-atlas-dev/delivery/**"
      - "docs/bijux-atlas-ops/**"
      - ".github/workflows/final-readiness.yml"

permissions:
  contents: read

jobs:
  readiness:
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.86.0
      - name: Build audit and readiness artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/system/simulation artifacts/audit
          cargo run --locked -q -p bijux-atlas-dev -- system simulate suite --output-format json > artifacts/system/simulation/run.json
          cargo run --locked -q -p bijux-atlas-dev -- docs health-dashboard --allow-write --format json > artifacts/audit/docs-health.json
          cargo run --locked -q -p bijux-atlas-dev -- governance validate --output-format json > artifacts/audit/governance-validate.json
          cargo run --locked -q -p bijux-atlas-dev -- audit bundle generate --output-format json > artifacts/audit/generate.json
          cargo run --locked -q -p bijux-atlas-dev -- audit compliance report --output-format json > artifacts/audit/compliance.json
          cargo run --locked -q -p bijux-atlas-dev -- audit readiness validate --output-format json > artifacts/audit/readiness.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: final-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/audit
            artifacts/system/simulation
          retention-days: 14
