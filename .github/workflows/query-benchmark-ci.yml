name: Query Benchmark CI

on:
  pull_request:
    paths:
      - "crates/bijux-atlas-query/src/**"
      - "crates/bijux-atlas-query/benches/**"
      - "crates/bijux-atlas-query/Cargo.toml"
      - ".github/workflows/query-benchmark-ci.yml"

jobs:
  query-benchmark-regression:
    name: "${{ (github.event.pull_request.user.login == 'dependabot[bot]' || (github.event.pull_request.user.login == 'github-actions[bot]' && github.event.pull_request.head.ref == 'automation/dependency-lock-refresh')) && 'unverified dependency / ' || '' }}query-benchmark-regression"
    if: "${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'pull_request_review') || (github.event.pull_request.user.login != 'dependabot[bot]' && (github.event.pull_request.user.login != 'github-actions[bot]' || github.event.pull_request.head.ref != 'automation/dependency-lock-refresh'))) && (github.event.pull_request.user.login != 'dependabot[bot]') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.86.0
      - name: Build query benchmark executables
        run: cargo bench -p bijux-atlas-query --bench query_patterns --no-run --locked
      - name: Run query benchmark regression fixture tests
        run: cargo test -p bijux-atlas-query --lib benchmark_threshold_sanity_non_regression --locked -- --nocapture
