        "run": "set -euo pipefail\n\nif [[ -f \".github/release.env\" ]]; then\n  # shellcheck disable=SC1091\n  source \".github/release.env\"\nfi\n\nnon_empty() {\n  local value=\"$1\"\n  [[ -n \"${value// }\" ]]\n}\n\nfrom_values() {\n  local input_value=\"$1\"\n  local env_value=\"$2\"\n  local repo_var_value=\"$3\"\n  local default_value=\"$4\"\n  if non_empty \"$input_value\"; then\n    printf '%s\\n' \"$input_value\"\n    return\n  fi\n  if non_empty \"$env_value\"; then\n    printf '%s\\n' \"$env_value\"\n    return\n  fi\n  if non_empty \"$repo_var_value\"; then\n    printf '%s\\n' \"$repo_var_value\"\n    return\n  fi\n  printf '%s\\n' \"$default_value\"\n}\n\nbool_from_values() {\n  local input_value=\"$1\"\n  local env_value=\"$2\"\n  local repo_var_value=\"$3\"\n  local default_value=\"$4\"\n  local raw\n  raw=\"$(from_values \"$input_value\" \"$env_value\" \"$repo_var_value\" \"$default_value\")\"\n  case \"${raw,,}\" in\n    true|1|yes|on) printf 'true\\n' ;;\n    false|0|no|off) printf 'false\\n' ;;\n    *) printf '%s\\n' \"$default_value\" ;;\n  esac\n}\n\nnormalize_bool_optional() {\n  local raw=\"$1\"\n  case \"${raw,,}\" in\n    true|1|yes|on) printf 'true\\n' ;;\n    false|0|no|off) printf 'false\\n' ;;\n    ''|null) printf '\\n' ;;\n    *) printf '\\n' ;;\n  esac\n}\n\nfilter_matrix() {\n  local raw=\"$1\"\n  local allowed_raw=\"$2\"\n  python3 - \"$raw\" \"$allowed_raw\" <<'PY'\nimport json\nimport re\nimport sys\n\nraw = sys.argv[1]\nallowed_raw = sys.argv[2]\ntry:\n    value = json.loads(raw)\nexcept Exception as exc:  # pragma: no cover\n    raise SystemExit(f\"Invalid matrix JSON: {exc}\")\nif not isinstance(value, list):\n    raise SystemExit(\"Matrix JSON must be a JSON array\")\nfor index, item in enumerate(value):\n    if not isinstance(item, dict):\n        raise SystemExit(f\"Matrix entry {index} must be an object\")\n    if \"package_slug\" not in item or not str(item[\"package_slug\"]).strip():\n        raise SystemExit(f\"Matrix entry {index} missing package_slug\")\n\nallowed = {\n    part.strip()\n    for part in re.split(r\"[\\s,;]+\", allowed_raw.strip())\n    if part.strip()\n}\nif allowed:\n    value = [item for item in value if str(item.get(\"package_slug\", \"\")).strip() in allowed]\n\nprint(json.dumps(value, separators=(\",\", \":\")))\nPY\n}\n\nif [[ \"${GITHUB_REF_TYPE:-}\" == \"tag\" ]]; then\n  default_tag=\"${GITHUB_REF_NAME}\"\nelse\n  default_tag=\"\"\nfi\n\ninput_enabled=\"$(normalize_bool_optional \"${INPUT_ENABLED_RAW}\")\"\nif [[ -z \"${input_enabled}\" ]]; then\n  input_enabled=\"$(normalize_bool_optional \"${DISPATCH_ENABLED_RAW}\")\"\nfi\n\ninput_push_latest=\"$(normalize_bool_optional \"${INPUT_PUSH_LATEST_RAW}\")\"\nif [[ -z \"${input_push_latest}\" ]]; then\n  input_push_latest=\"$(normalize_bool_optional \"${DISPATCH_PUSH_LATEST_RAW}\")\"\nfi\n\nrelease_tag=\"$(from_values \"${INPUT_RELEASE_TAG}\" \"${BIJUX_GHCR_RELEASE_TAG:-}\" \"${{ vars.BIJUX_GHCR_RELEASE_TAG || '' }}\" \"$default_tag\")\"\nenabled=\"$(bool_from_values \"${input_enabled}\" \"${BIJUX_GHCR_RELEASE_ENABLED:-}\" \"${{ vars.BIJUX_GHCR_RELEASE_ENABLED || '' }}\" \"false\")\"\nbuild_matrix_json=\"$(from_values \"${INPUT_BUILD_MATRIX_JSON}\" \"${BIJUX_RELEASE_BUILD_MATRIX_JSON:-}\" \"${{ vars.BIJUX_RELEASE_BUILD_MATRIX_JSON || '' }}\" \"[]\")\"\npackage_matrix_json=\"$(from_values \"${INPUT_PACKAGE_MATRIX_JSON}\" \"${BIJUX_GHCR_RELEASE_PACKAGE_MATRIX_JSON:-}\" \"${{ vars.BIJUX_GHCR_RELEASE_PACKAGE_MATRIX_JSON || '' }}\" \"[]\")\"\nallowed_packages=\"$(from_values \"\" \"${BIJUX_GHCR_RELEASE_ALLOWED_PACKAGES:-}\" \"${{ vars.BIJUX_GHCR_RELEASE_ALLOWED_PACKAGES || '' }}\" \"\")\"\nartifact_suffix=\"$(from_values \"${INPUT_ARTIFACT_SUFFIX}\" \"${BIJUX_GHCR_RELEASE_ARTIFACT_SUFFIX:-}\" \"${{ vars.BIJUX_GHCR_RELEASE_ARTIFACT_SUFFIX || '' }}\" \"-release\")\"\npackage_ref_prefix=\"$(from_values \"${INPUT_PACKAGE_REF_PREFIX}\" \"${BIJUX_GHCR_RELEASE_PACKAGE_REF_PREFIX:-}\" \"${{ vars.BIJUX_GHCR_RELEASE_PACKAGE_REF_PREFIX || '' }}\" \"ghcr.io/${GITHUB_REPOSITORY}\")\"\npush_latest=\"$(bool_from_values \"${input_push_latest}\" \"${BIJUX_GHCR_RELEASE_PUSH_LATEST:-}\" \"${{ vars.BIJUX_GHCR_RELEASE_PUSH_LATEST || '' }}\" \"true\")\"\nartifact_type=\"$(from_values \"${INPUT_ARTIFACT_TYPE}\" \"${BIJUX_GHCR_RELEASE_ARTIFACT_TYPE:-}\" \"${{ vars.BIJUX_GHCR_RELEASE_ARTIFACT_TYPE || '' }}\" \"application/vnd.bijux.release-bundle.v1+tar\")\"\narchive_media_type=\"$(from_values \"${INPUT_ARCHIVE_MEDIA_TYPE}\" \"${BIJUX_GHCR_RELEASE_ARCHIVE_MEDIA_TYPE:-}\" \"${{ vars.BIJUX_GHCR_RELEASE_ARCHIVE_MEDIA_TYPE || '' }}\" \"application/gzip\")\"\noras_version=\"$(from_values \"${INPUT_ORAS_VERSION}\" \"${BIJUX_GHCR_RELEASE_ORAS_VERSION:-}\" \"${{ vars.BIJUX_GHCR_RELEASE_ORAS_VERSION || '' }}\" \"1.2.3\")\"\n\nif [[ \"${enabled}\" == \"true\" && -n \"${release_tag}\" && \"${release_tag}\" != v* ]]; then\n  echo \"release_tag must start with 'v' when release-ghcr is enabled: ${release_tag}\" >&2\n  exit 1\nfi\n\nbuild_matrix_json=\"$(filter_matrix \"${build_matrix_json}\" \"${allowed_packages}\")\"\npackage_matrix_json=\"$(filter_matrix \"${package_matrix_json}\" \"${allowed_packages}\")\"\n\nif [[ \"${build_matrix_json}\" == \"[]\" || \"${package_matrix_json}\" == \"[]\" ]]; then\n  enabled=\"false\"\nfi\n\nif [[ \"${GITHUB_EVENT_NAME}\" == \"workflow_dispatch\" && \"${enabled}\" != \"true\" ]]; then\n  echo \"Manual dispatch resolved to a no-op release-ghcr run.\" >&2\n  echo \"Set enabled=true and ensure release matrices resolve to at least one package.\" >&2\n  exit 1\nfi\n\n{\n  echo \"enabled=${enabled}\"\n  echo \"release_tag=${release_tag}\"\n  echo \"allowed_packages=${allowed_packages}\"\n  echo \"artifact_suffix=${artifact_suffix}\"\n  echo \"package_ref_prefix=${package_ref_prefix}\"\n  echo \"push_latest=${push_latest}\"\n  echo \"artifact_type=${artifact_type}\"\n  echo \"archive_media_type=${archive_media_type}\"\n  echo \"oras_version=${oras_version}\"\n  echo \"build_matrix_js