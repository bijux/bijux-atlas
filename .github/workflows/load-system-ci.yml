name: Load System CI

on:
  pull_request:
    paths:
      - "ops/load/**"
      - "docs/bijux-atlas-ops/load/**"
      - "crates/bijux-atlas-ops/tests/load_suite_manifest.rs"
      - "crates/bijux-atlas-ops/tests/load_baseline_assets.rs"
      - ".github/workflows/load-system-ci.yml"
  push:
    branches: [main]
    paths:
      - "ops/load/**"
      - "docs/bijux-atlas-ops/load/**"
      - "crates/bijux-atlas-ops/tests/load_suite_manifest.rs"
      - "crates/bijux-atlas-ops/tests/load_baseline_assets.rs"
      - ".github/workflows/load-system-ci.yml"

jobs:
  load-contracts-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Validate load JSON contracts
        run: |
          jq . ops/load/suites/suites.json > /dev/null
          jq . ops/load/contracts/k6-thresholds.v1.json > /dev/null
          jq . ops/load/contracts/load-report.schema.json > /dev/null
          jq . ops/load/contracts/load-summary.schema.json > /dev/null
          jq . ops/load/generated/load-summary.json > /dev/null
          jq . ops/load/generated/load-drift-report.json > /dev/null
          jq . ops/load/generated/system-load-summary.json > /dev/null

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.86.0

      - name: Validate load comparison via control-plane command
        run: |
          cargo run --locked -p bijux-atlas-dev -- perf diff ops/load/baselines/system-load-baseline.json ops/load/baselines/system-load-baseline.json --format json > /tmp/load-diff.json
          jq . /tmp/load-diff.json > /dev/null

      - name: Run load suite manifest regression test
        run: cargo test -p bijux-atlas-ops --test load_suite_manifest --locked -- --nocapture

      - name: Run load baseline reproducibility regression test
        run: cargo test -p bijux-atlas-ops --test load_baseline_assets --locked -- --nocapture
