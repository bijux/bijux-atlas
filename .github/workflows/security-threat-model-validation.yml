name: security-threat-model-validation

on:
  pull_request:
    paths:
      - "ops/security/threat-model/**"
      - "crates/bijux-atlas-dev/src/application/security.rs"
      - "crates/bijux-atlas-dev/src/domains/security/**"
      - "crates/bijux-atlas-dev/src/interfaces/cli/mod.rs"
      - "crates/bijux-atlas-dev/README.md"
      - "docs/bijux-atlas-ops/security/**"
      - "docs/bijux-atlas-ops/kubernetes/security-operations.md"
      - "docs/bijux-atlas-ops/kubernetes/admin-endpoints-exceptions.md"
      - "docs/bijux-atlas-dev/index.md"
      - "docs/bijux-atlas-dev/automation/automation-control-plane.md"
      - "docs/bijux-atlas-dev/delivery/security-validation-lanes.md"
      - ".github/workflows/security-threat-model-validation.yml"
  workflow_dispatch:

jobs:
  verify:
    name: "${{ (github.event.pull_request.user.login == 'dependabot[bot]' || (github.event.pull_request.user.login == 'github-actions[bot]' && github.event.pull_request.head.ref == 'automation/dependency-lock-refresh')) && 'unverified dependency / ' || '' }}verify"
    if: "${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'pull_request_review') || (github.event.pull_request.user.login != 'dependabot[bot]' && (github.event.pull_request.user.login != 'github-actions[bot]' || github.event.pull_request.head.ref != 'automation/dependency-lock-refresh'))) && (github.event.pull_request.user.login != 'dependabot[bot]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.86.0
      - name: Threat model command verification
        run: |
          cargo run --locked -p bijux-atlas-dev -- security threats verify --format json
      - name: Threat model command contracts
        run: |
          cargo test --locked -p bijux-atlas-dev security_threat_ -- --nocapture
