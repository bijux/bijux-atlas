        "type": "string"
        "required": true
"permissions":
  "contents": "read"
  "actions": "read"
"concurrency":
  "group": "release-crates-${{ github.ref }}"
  "cancel-in-progress": false
"jobs":
  "publication_admission":
    "name": "publication / admission"
    "runs-on": "ubuntu-latest"
    "permissions":
      "contents": "read"
      "checks": "read"
    "steps":
      - "name": "Checkout immutable workflow input"
        "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        "with":
          "ref": "${{ github.sha }}"
          "persist-credentials": false
      - "name": "Authorize authenticated exact-commit publication"
        "env":
          "GH_TOKEN": "${{ github.token }}"
          "PUBLICATION_REPOSITORY": "${{ github.repository }}"
          "PUBLICATION_EVENT": "${{ github.event_name }}"
          "PUBLICATION_REF": "${{ github.ref }}"
          "PUBLICATION_ACTOR": "${{ github.actor }}"
          "PUBLICATION_ACTOR_ID": "${{ github.actor_id }}"
          "PUBLICATION_TRIGGERING_ACTOR": "${{ github.triggering_actor }}"
          "PUBLICATION_CONTROLLER_ACTOR_ID": "${{ vars.BIJUX_PUBLICATION_ACTOR_ID }}"
          "PUBLICATION_COMMIT": "${{ inputs.accepted_commit }}"
          "PUBLICATION_RUN_SHA": "${{ github.sha }}"
          "PUBLICATION_WORKFLOW": "release-crates"
          "PUBLICATION_TAG": "${{ inputs.release_tag || '' }}"
          "PYTHONPYCACHEPREFIX": "${{ github.workspace }}/artifacts/python/pycache"
        "run": "python3 .bijux/shared/bijux-gh/scripts/publication_admission.py"
  "resolve":
    "name": "resolve-release-crates-config"
    "runs-on": "ubuntu-24.04"
    "outputs":
      "enabled": "${{ steps.config.outputs.enabled }}"
      "release_tag": "${{ steps.config.outputs.release_tag }}"
      "wait_for_ci_command": "${{ steps.config.outputs.wait_for_ci_command }}"
      "plan_command": "${{ steps.config.outputs.plan_command }}"
      "setup_rust": "${{ steps.config.outputs.setup_rust }}"
      "rust_toolchain": "${{ steps.config.outputs.rust_toolchain }}"
      "verify_token_command": "${{ steps.config.outputs.verify_token_command }}"
      "publish_command": "${{ steps.config.outputs.publish_command }}"
