      "fallback_packages": "${{ steps.config.outputs.fallback_packages }}"
      "allowed_packages": "${{ steps.config.outputs.allowed_packages }}"
    "steps":
      - "name": "Checkout release configuration"
        "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        "with":
          "fetch-depth": 1
      - "name": "Resolve release-crates configuration"
        "id": "config"
        "shell": "bash"
        "run": "set -euo pipefail\n\nif [[ -f \".github/release.env\" ]]; then\n  # shellcheck disable=SC1091\n  source \".github/release.env\"\nfi\n\nnon_empty() {\n  local value=\"$1\"\n  [[ -n \"${value// }\" ]]\n}\n\nfrom_values() {\n  local input_value=\"$1\"\n  local env_value=\"$2\"\n  local repo_var_value=\"$3\"\n  local default_value=\"$4\"\n  if non_empty \"$input_value\"; then\n    printf '%s\\n' \"$input_value\"\n    return\n  fi\n  if non_empty \"$env_value\"; then\n    printf '%s\\n' \"$env_value\"\n    return\n  fi\n  if non_empty \"$repo_var_value\"; then\n    printf '%s\\n' \"$repo_var_value\"\n    return\n  fi\n  printf '%s\\n' \"$default_value\"\n}\n\nbool_from_values() {\n  local input_value=\"$1\"\n  local env_value=\"$2\"\n  local repo_var_value=\"$3\"\n  local default_value=\"$4\"\n  local raw\n  raw=\"$(from_values \"$input_value\" \"$env_value\" \"$repo_var_value\" \"$default_value\")\"\n  case \"${raw,,}\" in\n    true|1|yes|on) printf 'true\\n' ;;\n    false|0|no|off) printf 'false\\n' ;;\n    *) printf '%s\\n' \"$default_value\" ;;\n  esac\n}\n\nif [[ \"${GITHUB_REF_TYPE:-}\" == \"tag\" ]]; then\n  default_tag=\"${GITHUB_REF_NAME}\"\nelse\n  default_tag=\"\"\nfi\n\ninput_enabled=\"\"\nif [[ \"${GITHUB_EVENT_NAME:-}\" == \"workflow_dispatch\" ]]; then\n  input_enabled=\"${{ github.event.inputs.enabled || '' }}\"\nelif [[ \"${GITHUB_EVENT_NAME:-}\" == \"workflow_call\" ]]; then\n  input_enabled=\"${{ inputs.enabled && 'true' || 'false' }}\"\nfi\n\nrelease_tag=\"$(from_values \"${{ inputs.release_tag || github.event.inputs.release_tag || '' }}\" \"${BIJUX_CRATES_RELEASE_TAG:-}\" \"${{ vars.BIJUX_CRATES_RELEASE_TAG || '' }}\" \"$default_tag\")\"\nenabled=\"$(bool_from_values \"${input_enabled}\" \"${BIJUX_CRATES_RELEASE_ENABLED:-}\" \"${{ vars.BIJUX_CRATES_RELEASE_ENABLED || '' }}\" \"false\")\"\nwait_for_ci_command=\"$(from_values \"\" \"${BIJUX_CRATES_RELEASE_WAIT_FOR_CI_COMMAND:-}\" \"${{ vars.BIJUX_CRATES_RELEASE_WAIT_FOR_CI_COMMAND || '' }}\" \"\")\"\nplan_command=\"$(from_values \"\" \"${BIJUX_CRATES_RELEASE_PLAN_COMMAND:-}\" \"${{ vars.BIJUX_CRATES_RELEASE_PLAN_COMMAND || '' }}\" \"\")\"\nsetup_rust=\"$(bool_from_values \"\" \"${BIJUX_CRATES_RELEASE_SETUP_RUST:-}\" \"${{ vars.BIJUX_CRATES_RELEASE_SETUP_RUST || '' }}\" \"true\")\"\nrust_toolchain=\"$(from_values \"\" \"${BIJUX_CRATES_RELEASE_RUST_TOOLCHAIN:-}\" \"${{ vars.BIJUX_CRATES_RELEASE_RUST_TOOLCHAIN || '' }}\" \"stable\")\"\nverify_token_command=\"$(from_values \"\" \"${BIJUX_CRATES_RELEASE_VERIFY_TOKEN_COMMAND:-}\" \"${{ vars.BIJUX_CRATES_RELEASE_VERIFY_TOKEN_COMMAND || '' }}\" \"make gh-release-require-cargo-token\")\"\npublish_command=\"$(from_values \"\" \"${BIJUX_CRATES_RELEASE_PUBLISH_COMMAND:-}\" \"${{ vars.BIJUX_CRATES_RELEASE_PUBLISH_COMMAND || '' }}\" \"make publish-rs RUST_PUBLISH_DRY_RUN=0 RUST_PUBLISH_SKIP_EXISTING=\\\"\\${PUBLISH_SKIP_EXISTING}\\\" RUST_PUBLISH_PACKAGES=\\\"\\${PACKAGES}\\\"\")\"\npublish_skip_existing=\"$(bool_from_values \"\" \"${BIJUX_CRATES_RELEASE_PUBLISH_SKIP_EXISTING:-}\" \"${{ vars.BIJUX_CRATES_RELEASE_PUBLISH_SKIP_EXISTING || '' }}\" \"true\")\"\nfallback_packages=\"$(from_values \"\" \"${BIJUX_CRATES_RELEASE_PACKAGES:-}\" \"${{ vars.BIJUX_CRATES_RELEASE_PACKAGES || '' }}\" \"\")\"\nallowed_packages=\"$(from_values \"\" \"${BIJUX_CRATES_RELEASE_ALLOWED_PACKAGES:-}\" \"${{ vars.BIJUX_CRATES_RELEASE_ALLOWED_PACKAGES || '' }}\" \"\")\"\n\n{\n  echo \"enabled=${enabled}\"\n  echo \"release_tag=${release_tag}\"\n  echo \"wait_for_ci_command=${wait_for_ci_command}\"\n  echo \"plan_command=${plan_command}\"\n  echo \"setup_rust=${setup_rust}\"\n  echo \"rust_toolchain=${rust_toolchain}\"\n  echo \"verify_token_command=${verify_token_command}\"\n  echo \"publish_command=${publish_command}\"\n  echo \"publish_skip_existing=${publish_skip_existing}\"\n  echo \"fallback_packages=${fallback_packages}\"\n  echo \"allowed_packages=${allowed_packages}\"\n} >> \"$GITHUB_OUTPUT\"\n"
    "needs":
      - "publication_admission"
    "if": "${{ needs.publication_admission.result == 'success' && (success()) }}"
  "publish":
    "name": "publish-crates"
    "needs":
      - "publication_admission"
      - "resolve"
    "if": "${{ needs.publication_admission.result == 'success' && (needs.resolve.outputs.enabled == 'true') }}"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 30
    "steps":
      - "name": "Checkout release commit"
        "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        "with":
          "fetch-depth": 0
          "ref": "${{ github.sha }}"
      - "name": "Observe CI gate once"
        "if": "${{ github.event_name == 'push' && needs.resolve.outputs.wait_for_ci_command != '' }}"
        "env":
          "GITHUB_TOKEN": "${{ github.token }}"
          "TARGET_SHA": "${{ github.sha }}"
          "TARGET_REF_NAME": "${{ github.ref_name }}"
          "WAIT_FOR_CI_COMMAND": "${{ needs.resolve.outputs.wait_for_ci_command }}"
        "shell": "bash"
        "run": "set -euo pipefail\neval \"${WAIT_FOR_CI_COMMAND}\"\n"
      - "name": "Decide whether to publish crates.io packages"
        "id": "plan"
        "if": "${{ needs.resolve.outputs.plan_command != '' }}"
        "env":
          "PLAN_COMMAND": "${{ needs.resolve.outputs.plan_command }}"
          "TARGET_SHA": "${{ github.sha }}"
        "shell": "bash"
        "run": "set -euo pipefail\neval \"${PLAN_COMMAND}\"\n"
      - "name": "Resolve publish decision"
        "id": "release"
        "shell": "bash"
        "run": "set -euo pipefail\n\npublish=\"${{ steps.plan.outputs.publish || '' }}\"\nif [[ -z \"${publish}\" ]]; then\n  publish=\"true\"\nfi\n\nrelease_version=\"${{ steps.plan.outputs.version || '' }}\"\nif [[ -z \"${release_version}\" ]]; then\n  release_tag=\"${{ needs.resolve.outputs.release_tag }}\"\n  release_version=\"${release_tag#v}\"\nfi\n\npackages=\"${{ steps.plan.outputs.packages || '' }}\"\nif [[ -z \"${packages}\" ]]; then\n  packages=\"${{ needs.resolve.outputs.fallback_packages }}\"\nfi\n\nallowed_packages=\"${{ needs.resolve.outputs.allowed_packages }}\"\nfiltered_packages=\"$(python3 - \"$packages\" \"$allowed_packages\" <<'PY'\nimport re\nimport sys\n\npackages_raw = sys.argv[1]\nallowed_raw = sys.argv[2]\n\npackages = [part.strip() for part in re.split(r\"[\\s,;]+\", packages_raw.strip()) if part.strip()]\nallowed = {part.strip() for part in re.split(r\"[\\s,;]+\", allowed_raw.strip()) if part.strip()}\n\nif allowed:\n    if not packages:\n        packages = sorted(allowed)\n    else:\n        packages = [name for name in packages if name in allowed]\n\nprint(\" \".join(packages))\nPY\n)\"\n\nif [[ -n \"${allowed_packages// }\" && -z \"${filtered_packages// }\" ]]; then\n  publish=\"false\"\nfi\n\necho \"publish=${publish}\" >> \"$GITHUB_OUTPUT\"\necho \"version=${release_version}\" >> \"$GITHUB_OUTPUT\"\necho \"packages=${filtered_packages}\" >> \"$GITHUB_OUTPUT\"\n"
      - "name": "Set up Rust"
        "if": "${{ steps.release.outputs.publish == 'true' && needs.resolve.outputs.setup_rust == 'true' }}"
        "uses": "dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8"
        "with":
          "toolchain": "${{ needs.resolve.outputs.rust_toolchain }}"
      - "name": "Restore the Rust cache"
        "if": "${{ steps.release.outputs.publish == 'true' && needs.resolve.outputs.setup_rust == 'true' }}"
        "uses": "Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6"
      - "name": "Verify crates.io credentials"
        "if": "${{ steps.release.outputs.publish == 'true' && needs.resolve.outputs.verify_token_command != '' }}"
        "env":
          "CARGO_REGISTRY_TOKEN": "${{ secrets.CARGO_REGISTRY_TOKEN }}"
          "VERIFY_TOKEN_COMMAND": "${{ needs.resolve.outputs.verify_token_command }}"
        "shell": "bash"
        "run": "set -euo pipefail\neval \"${VERIFY_TOKEN_COMMAND}\"\n"
      - "name": "Publish crates.io packages"
        "if": "${{ steps.release.outputs.publish == 'true' }}"
        "env":
          "CARGO_REGISTRY_TOKEN": "${{ secrets.CARGO_REGISTRY_TOKEN }}"
          "PUBLISH_COMMAND": "${{ needs.resolve.outputs.publish_command }}"
          "RELEASE_VERSION": "${{ steps.release.outputs.version }}"
          "PACKAGES": "${{ steps.release.outputs.packages }}"
          "PUBLISH_SKIP_EXISTING": "${{ needs.resolve.outputs.publish_skip_existing == 'true' && '1' || '0' }}"
        "shell": "bash"
        "run": "set -euo pipefail\neval \"${PUBLISH_COMMAND}\"\n"
