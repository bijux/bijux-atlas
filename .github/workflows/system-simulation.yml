name: system-simulation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/bijux-atlas-dev/src/commands/system.rs"
      - "configs/sources/operations/system/**"
      - ".github/workflows/system-simulation.yml"

permissions:
  contents: read

concurrency:
  group: system-simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    name: "${{ (github.event.pull_request.user.login == 'dependabot[bot]' || (github.event.pull_request.user.login == 'github-actions[bot]' && github.event.pull_request.head.ref == 'automation/dependency-lock-refresh')) && 'unverified dependency / ' || '' }}simulate"
    if: "${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'pull_request_review') || (github.event.pull_request.user.login != 'dependabot[bot]' && (github.event.pull_request.user.login != 'github-actions[bot]' || github.event.pull_request.head.ref != 'automation/dependency-lock-refresh'))) && (github.event.pull_request.user.login != 'dependabot[bot]') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.86.0
      - name: Run deterministic simulation suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/system/simulation
          cargo run --locked -q -p bijux-atlas-dev -- system simulate suite --output-format json > artifacts/system/simulation/run.json
          test -f artifacts/system/simulation/index.json
          test -f artifacts/system/simulation/coverage.json
          test -f artifacts/system/simulation/resilience-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: system-simulation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/system/simulation
          retention-days: 14
